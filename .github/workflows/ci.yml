name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lessonplan
          POSTGRES_PASSWORD: lessonplan
          POSTGRES_DB: lessonplan
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U lessonplan" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: postgresql://lessonplan:lessonplan@localhost:5434/lessonplan?schema=public
      AUTH_SECRET: ci-only-secret-value-that-is-at-least-32-chars-long
      SUPER_ADMIN_EMAIL: owner@example.com
      SUPER_ADMIN_PASSWORD: ChangeMe123!
      PUSH_ENABLED: "0"
      # The production build only allows listed origins; the CORS test uses this one.
      CORS_ORIGINS: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run db:seed && npm run seed:demo && npm run seed:sample
      - run: npm run build
      - name: Start server and run API tests
        run: |
          cp -r public .next/standalone/public && cp -r .next/static .next/standalone/.next/static
          (node .next/standalone/server.js &) && npx wait-on http://localhost:3000/api/health -t 60000
          npm run test:api
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
  docker:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lessonplan-web ./web
